name: APK qurish

# Har bir push va pull request'da debug va release APK avtomatik quriladi.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debug va Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle sozlash
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew'ga ruxsat berish
        run: chmod +x ./gradlew

      - name: APK qurish
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Debug APK'ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: UzNav-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release APK'ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: UzNav-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
